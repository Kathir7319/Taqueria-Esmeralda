<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Rich Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Warm Golden Maize Gradient -->
    <linearGradient id="maizeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Terracotta Salsa Gradient -->
    <linearGradient id="salsaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Gem Facet Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#047857" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Aztec Sun Rays Circle -->
  <g opacity="0.85" stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <line x1="160" y1="18" x2="160" y2="30" />
    <line x1="160" y1="290" x2="160" y2="302" />
    <line x1="18" y1="160" x2="30" y2="160" />
    <line x1="290" y1="160" x2="302" y2="160" />
    <line x1="58" y1="58" x2="68" y2="68" />
    <line x1="252" y1="252" x2="262" y2="262" />
    <line x1="58" y1="262" x2="68" y2="252" />
    <line x1="252" y1="68" x2="262" y2="58" />
    <line x1="108" y1="34" x2="114" y2="46" />
    <line x1="212" y1="34" x2="206" y2="46" />
    <line x1="108" y1="286" x2="114" y2="274" />
    <line x1="212" y1="286" x2="206" y2="274" />
  </g>

  <!-- Ornamental Outer Ring -->
  <circle cx="160" cy="160" r="132" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="160" cy="160" r="124" fill="#064e3b" filter="url(#emeraldGlow)"/>
  <circle cx="160" cy="160" r="118" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>

  <!-- Emerald Diamond Crest Backdrop -->
  <polygon points="160,52 245,118 212,230 108,230 75,118" fill="url(#emeraldGrad)" opacity="0.45"/>

  <!-- Stylized Artisanal Taco Shell (Golden Masa) -->
  <g transform="translate(160,152)">
    <!-- Shadow beneath taco -->
    <ellipse cx="0" cy="42" rx="60" ry="10" fill="#022c22" opacity="0.6"/>

    <!-- Double Corn Tortilla Shell (Folded Taco) -->
    <path d="M-64,18 C-60,-22 60,-22 64,18 C64,28 -64,28 -64,18 Z" fill="#b45309" opacity="0.4"/>
    <path d="M-60,14 C-56,-24 56,-24 60,14 C50,38 -50,38 -60,14 Z" fill="url(#maizeGrad)" stroke="#d97706" stroke-width="2"/>
    
    <!-- Toast / Grill Marks on Corn Tortilla -->
    <ellipse cx="-25" cy="10" rx="4" ry="2" fill="#92400e" opacity="0.5" transform="rotate(-15, -25, 10)"/>
    <ellipse cx="15" cy="16" rx="5" ry="2" fill="#92400e" opacity="0.4" transform="rotate(10, 15, 16)"/>
    <ellipse cx="0" cy="2" rx="3.5" ry="1.5" fill="#92400e" opacity="0.5"/>

    <!-- Savory Filling (Carne Asada / Pastor & Seasonings) -->
    <path d="M-45,6 C-30,-12 30,-12 45,6 C30,12 -30,12 -45,6 Z" fill="#881337"/>
    <circle cx="-28" cy="2" r="6" fill="#be123c"/>
    <circle cx="-12" cy="-2" r="7" fill="#9f1239"/>
    <circle cx="6" cy="1" r="7.5" fill="#be123c"/>
    <circle cx="26" cy="3" r="6" fill="#881337"/>
    
    <!-- Charred Pineapple (Al Pastor touch) -->
    <polygon points="-8,-6 -2,-12 4,-6 -2,0" fill="#fde047" stroke="#d97706" stroke-width="0.8"/>
    <polygon points="12,-4 18,-10 24,-4 18,2" fill="#fde047" stroke="#d97706" stroke-width="0.8"/>

    <!-- Fresh Cilantro Leaves & Diced White Onions -->
    <circle cx="-18" cy="-4" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="-6" cy="2" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="16" cy="-2" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="2" cy="-6" r="2.2" fill="#ffffff" opacity="0.95"/>

    <!-- Vibrant Green Cilantro Herb Sprigs -->
    <path d="M-22,-8 Q-18,-16 -12,-12 Q-14,-6 -22,-8 Z" fill="#10b981"/>
    <path d="M-2,-10 Q4,-18 8,-12 Q3,-6 -2,-10 Z" fill="#34d399"/>
    <path d="M14,-8 Q20,-15 24,-10 Q19,-5 14,-8 Z" fill="#10b981"/>

    <!-- Fresh Green Lime Wedge on the side -->
    <g transform="translate(46, 12) rotate(24)">
      <path d="M0,0 A16,16 0 0,1 24,0 Z" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
      <path d="M2,-1 A13,13 0 0,1 22,-1 Z" fill="#6ee7b7"/>
      <line x1="12" y1="-1" x2="6" y2="7" stroke="#10b981" stroke-width="1"/>
      <line x1="12" y1="-1" x2="12" y2="11" stroke="#10b981" stroke-width="1"/>
      <line x1="12" y1="-1" x2="18" y2="7" stroke="#10b981" stroke-width="1"/>
    </g>

    <!-- Salsa Roja Drizzle -->
    <path d="M-35,4 Q-20,-2 -10,3 Q5,-1 20,4 Q30,1 36,6" fill="none" stroke="url(#salsaGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Crown Emerald Gem on Top -->
  <g transform="translate(160, 88)">
    <polygon points="0,-18 16,-4 10,14 -10,14 -16,-4" fill="url(#emeraldGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Facet highlights -->
    <polygon points="0,-18 7,-4 0,14 -7,-4" fill="#6ee7b7" opacity="0.75"/>
    <polygon points="0,-18 16,-4 7,-4" fill="#a7f3d0" opacity="0.9"/>
  </g>

  <!-- Banner Ribbon / Brand Text -->
  <path d="M60,208 Q160,222 260,208 L252,246 Q160,260 68,246 Z" fill="#047857" stroke="#fbbf24" stroke-width="1.5"/>
  
  <text x="160" y="233" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, serif" 
        font-weight="800" 
        font-size="19" 
        letter-spacing="2.5" 
        fill="#fef08a">
    ESMERALDA
  </text>

  <text x="160" y="202" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-weight="700" 
        font-size="11" 
        letter-spacing="3" 
        fill="#fde68a">
    TAQUERIA
  </text>

  <!-- Subtitle Tagline -->
  <text x="160" y="268" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-weight="600" 
        font-size="8.5" 
        letter-spacing="2" 
        fill="#a7f3d0">
    MORRISVILLE • NC
  </text>
  
  <!-- Star Accents -->
  <polygon points="120,265 122,261 126,261 123,264 124,268 120,265" fill="#f59e0b"/>
  <polygon points="200,265 202,261 206,261 203,264 204,268 200,265" fill="#f59e0b"/>
</svg>
